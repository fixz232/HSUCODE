<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#141621;overflow:hidden}
  #c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
const A="../pixel/", IMG={};
const NEED={
  floor:"floors/floor_0.png", desk:"furniture/SMALL_TABLE_FRONT.png",
  pcOff:"furniture/PC_FRONT_OFF.png", pcOn1:"furniture/PC_FRONT_ON_1.png",
  pcOn2:"furniture/PC_FRONT_ON_2.png", pcOn3:"furniture/PC_FRONT_ON_3.png",
  bookshelf:"decor/BOOKSHELF.png", plant:"decor/PLANT.png", clock:"decor/CLOCK.png",
  whiteboard:"decor/WHITEBOARD.png", cactus:"decor/CACTUS.png"
};
for(let i=0;i<6;i++)NEED["char"+i]="characters/char_"+i+".png";

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;
let loaded=0,total=Object.keys(NEED).length,W=0,H=0,DPR=1;
let agents=[],brainBusy=false,brainText="",motionEnabled=true,raf=0,last=0;

function schedule(){
  if(!raf&&!document.hidden)raf=requestAnimationFrame(ts=>{raf=0;frame(ts)});
}
for(const key in NEED){
  const image=new Image();
  image.onload=image.onerror=()=>{loaded++;schedule()};
  image.src=A+NEED[key];IMG[key]=image;
}

function ensureSize(){
  const width=cv.clientWidth||360,height=cv.clientHeight||210,dpr=Math.min(window.devicePixelRatio||1,2);
  if(width!==W||height!==H||dpr!==DPR){
    W=width;H=height;DPR=dpr;cv.width=Math.max(1,W*DPR|0);cv.height=Math.max(1,H*DPR|0);
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  }
}
function isActive(status){return ["queued","preparing","running","waiting_permission"].includes(status)}
function statusColor(status){
  return ({queued:"#E9BC63",preparing:"#E9BC63",running:"#70C99B",waiting_permission:"#F2C14E",
    succeeded:"#8FD8B4",failed:"#FF9B95",cancelled:"#A0A8B9",timed_out:"#FFB36B",unknown:"#FF9B95",idle:"#7D849B"})[status]||"#7D849B";
}
function statusLabel(status){
  return ({queued:"排队",preparing:"准备",running:"执行",waiting_permission:"待审批",succeeded:"完成",
    failed:"失败",cancelled:"取消",timed_out:"超时",unknown:"未知",idle:"待命"})[status]||"待命";
}

window.setAgents=function(list){
  try{
    const incoming=typeof list==="string"?JSON.parse(list):list;
    const byId=new Map(agents.map(a=>[a.id,a]));
    agents=(Array.isArray(incoming)?incoming:[]).map((item,index)=>{
      const id=item.id||("legacy:"+index+":"+(item.name||"agent"));
      return Object.assign(byId.get(id)||{id,progress:0},item,{id,index});
    });
    if(!motionEnabled)agents.forEach(a=>a.progress=isActive(a.status)?1:0);
    schedule();
  }catch(_){ }
};
window.setBrain=function(busy,text){brainBusy=!!busy;brainText=text||"";schedule()};
window.setMotionEnabled=function(enabled){
  motionEnabled=!!enabled;
  if(!motionEnabled)agents.forEach(a=>a.progress=isActive(a.status)?1:0);
  schedule();
};

function drawImg(image,sx,sy,sw,sh,dx,dy,dw,dh){
  if(image&&image.complete&&image.naturalWidth)ctx.drawImage(image,sx,sy,sw,sh,dx,dy,dw,dh);
}
function place(image,cx,feetY,scale){
  if(!image||!image.naturalWidth)return;
  const width=image.naturalWidth*scale,height=image.naturalHeight*scale;
  drawImg(image,0,0,image.naturalWidth,image.naturalHeight,cx-width/2,feetY-height,width,height);
}
function drawChar(index,frame,cx,feetY,scale){
  const image=IMG["char"+(index%6)],width=14*scale,height=28*scale;
  drawImg(image,frame*16,0,16,32,cx-width/2,feetY-height,width,height);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function fitText(text,maxWidth){
  if(ctx.measureText(text).width<=maxWidth)return text;
  let value=text;while(value.length>1&&ctx.measureText(value+"…").width>maxWidth)value=value.slice(0,-1);
  return value+"…";
}
function bubble(text,cx,y,maxWidth){
  if(!text)return;
  ctx.font="11px sans-serif";const label=fitText(text,maxWidth-14),width=Math.min(maxWidth,ctx.measureText(label).width+14);
  const x=Math.max(4,Math.min(W-width-4,cx-width/2));
  ctx.fillStyle="rgba(249,248,242,.95)";roundRect(x,y,width,24,5);ctx.fill();
  ctx.fillStyle="#20232D";ctx.textAlign="left";ctx.fillText(label,x+7,y+16);
}
function floor(){
  const size=24;
  for(let y=0;y<H;y+=size)for(let x=0;x<W;x+=size)drawImg(IMG.floor,0,0,16,16,x,y,size,size);
  ctx.fillStyle="rgba(92,64,44,.18)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#2E2A44";ctx.fillRect(0,0,W,18);ctx.fillRect(0,0,7,H);ctx.fillRect(W-7,0,7,H);
  ctx.fillStyle="#45406A";ctx.fillRect(0,0,W,4);ctx.fillRect(0,H-5,W,5);
}
function decoration(scale){
  place(IMG.bookshelf,W-22,58,scale*.72);place(IMG.plant,18,H-10,scale*.72);place(IMG.cactus,W-17,H-10,scale*.62);
  place(IMG.whiteboard,W*.52,38,scale*.55);place(IMG.clock,W*.74,34,scale*.55);
}

function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;ensureSize();
  ctx.fillStyle="#141621";ctx.fillRect(0,0,W,H);
  if(loaded<total){
    ctx.fillStyle="#ADB4C9";ctx.font="13px monospace";ctx.textAlign="center";ctx.fillText("加载像素场景 "+loaded+"/"+total,W/2,H/2);
    if(loaded<total)schedule();return;
  }
  floor();
  const baseScale=Math.max(1.05,Math.min(1.75,H/125));decoration(baseScale);

  const managerX=42,managerFeet=Math.min(H-34,H*.68),phase=ts/220;
  drawChar(0,brainBusy&&motionEnabled?Math.floor(phase)%2:0,managerX,managerFeet,baseScale);
  place(IMG.desk,managerX,managerFeet+12*baseScale,baseScale*1.05);
  ctx.fillStyle="#F2C14E";ctx.fillRect(managerX-8,25,4,4);ctx.fillRect(managerX-2,21,4,4);ctx.fillRect(managerX+4,25,4,4);
  if(brainBusy&&brainText)bubble(brainText,Math.min(W*.56,managerX+105),20,Math.min(190,W*.48));

  const n=Math.max(1,agents.length),rows=n<=4?1:2,cols=Math.ceil(n/rows);
  const left=88,right=W-16,cellW=Math.max(30,(right-left)/cols),cellH=(H-42)/rows;
  const workerScale=Math.max(.75,Math.min(baseScale,cellW/30,cellH/58));
  let transitioning=false,active=false;
  agents.forEach((agent,index)=>{
    const target=isActive(agent.status)?1:0;active=active||target===1;
    if(motionEnabled){agent.progress+=(target-agent.progress)*Math.min(1,dt*4)}else agent.progress=target;
    if(Math.abs(agent.progress-target)>.01)transitioning=true;
    const row=Math.floor(index/cols),col=index%cols,cx=left+cellW*(col+.5),feet=58+cellH*(row+.58);
    const running=agent.status==="running",pc=running?[IMG.pcOn1,IMG.pcOn2,IMG.pcOn3][Math.floor(phase)%3]:IMG.pcOff;
    place(IMG.desk,cx,feet+10*workerScale,workerScale*.94);
    drawChar(index+1,running&&motionEnabled?Math.floor(phase)%2:0,cx,feet,workerScale);
    place(pc,cx,feet+7*workerScale,workerScale*.66);
    ctx.fillStyle=statusColor(agent.status);ctx.beginPath();ctx.arc(cx-cellW*.34,feet+18*workerScale,3,0,Math.PI*2);ctx.fill();
    ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillStyle="#F3EFE0";
    ctx.fillText(fitText(agent.name||"智能体",Math.max(26,cellW-8)),cx,feet+22*workerScale);
    ctx.font="9px sans-serif";ctx.fillStyle=statusColor(agent.status);ctx.fillText(statusLabel(agent.status),cx,feet+32*workerScale);
    if(agent.status==="waiting_permission"&&row===0)bubble("等待审批",cx,Math.max(46,feet-49*workerScale),Math.min(82,cellW+20));
  });

  if(motionEnabled&&(brainBusy||active||transitioning))schedule();
}
window.addEventListener("resize",schedule);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)schedule()});
schedule();
</script>
</body>
</html>
